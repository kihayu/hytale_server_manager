# ==========================================================================
# Hytale Server Manager — Development Multi-Node Docker Compose
# ==========================================================================
#
# Single node (default):
#   docker compose -f docker-compose.dev.yml up
#
# Multi-node development:
#   docker compose -f docker-compose.dev.yml --profile multi-node up
#
# ==========================================================================

name: hytale_server_manager_dev

services:
  # ── Shared Infrastructure ────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: hsm-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hsm
      POSTGRES_PASSWORD: hsm_dev_password
      POSTGRES_DB: hytale_manager
    volumes:
      - hsm-postgres-dev:/var/lib/postgresql/data
    networks:
      - hsm-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hsm-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - hsm-redis-dev:/data
    networks:
      - hsm-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── HSM Server Node 1 (default) ─────────────────────────────────────

  server:
    image: node:24-slim
    container_name: hsm-server-dev
    working_dir: /app
    command: sh -c "apt-get update -q && apt-get install -y --no-install-recommends wget gnupg ca-certificates && mkdir -p /etc/apt/keyrings && wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg && echo 'deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb bookworm main' > /etc/apt/sources.list.d/adoptium.list && apt-get update -q && apt-get install -y --no-install-recommends temurin-25-jre && apt-get clean && rm -rf /var/lib/apt/lists/* && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm -C packages/server run prisma:generate && pnpm dev:server"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - HOST=0.0.0.0
      # Node identity
      - NODE_ID=dev-node-1
      - INTERNAL_ADDRESS=http://server:8080
      - INTERNAL_SECRET=dev-internal-secret
      # Shared infrastructure
      - DATABASE_URL=postgresql://hsm:hsm_dev_password@postgres:5432/hytale_manager
      - REDIS_URL=redis://redis:6379
      # Paths
      - DATA_PATH=/app/data
      - SERVERS_BASE_PATH=/app/data/servers
      - BACKUPS_BASE_PATH=/app/data/backups
      - LOGS_PATH=/app/data/logs
      - CERTS_PATH=/app/data/certs
      - HTTPS_ENABLED=false
      - CORS_ORIGIN=http://localhost:3030
      # Shared secrets (must match all nodes)
      - JWT_SECRET=dev-jwt-secret-change-me-min-32-chars-here
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-me-min-32-chars
      - SETTINGS_ENCRYPTION_KEY=dev-enc-key-32ch
    volumes:
      # Mount entire monorepo so pnpm workspace resolution works
      - .:/app
      # Prevent host node_modules from leaking in
      - /app/node_modules
      - /app/packages/server/node_modules
      # Shared volumes with production
      - hsm-servers:/app/data/servers
      - hsm-backups:/app/data/backups
      - hsm-logs:/app/data/logs
      - hsm-certs:/app/data/certs
      - hsm-downloader:/app/data/hytale-downloader
    networks:
      - hsm-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── HSM Server Node 2 (multi-node dev profile) ──────────────────────

  server-node-2:
    profiles: ["multi-node"]
    image: node:24-slim
    container_name: hsm-server-dev-node2
    working_dir: /app
    command: sh -c "apt-get update -q && apt-get install -y --no-install-recommends wget gnupg ca-certificates && mkdir -p /etc/apt/keyrings && wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg && echo 'deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb bookworm main' > /etc/apt/sources.list.d/adoptium.list && apt-get update -q && apt-get install -y --no-install-recommends temurin-25-jre && apt-get clean && rm -rf /var/lib/apt/lists/* && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm -C packages/server run prisma:generate && pnpm dev:server"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - HOST=0.0.0.0
      # Node identity — different from node 1
      - NODE_ID=dev-node-2
      - INTERNAL_ADDRESS=http://server-node-2:8080
      - INTERNAL_SECRET=dev-internal-secret
      # Same shared infrastructure
      - DATABASE_URL=postgresql://hsm:hsm_dev_password@postgres:5432/hytale_manager
      - REDIS_URL=redis://redis:6379
      # Paths
      - DATA_PATH=/app/data
      - SERVERS_BASE_PATH=/app/data/servers
      - BACKUPS_BASE_PATH=/app/data/backups
      - LOGS_PATH=/app/data/logs
      - CERTS_PATH=/app/data/certs
      - HTTPS_ENABLED=false
      - CORS_ORIGIN=http://localhost:3030
      # Same shared secrets as node 1
      - JWT_SECRET=dev-jwt-secret-change-me-min-32-chars-here
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-me-min-32-chars
      - SETTINGS_ENCRYPTION_KEY=dev-enc-key-32ch
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/server/node_modules
      - hsm-servers:/app/data/servers
      - hsm-backups:/app/data/backups
      - hsm-logs:/app/data/logs
      - hsm-certs:/app/data/certs
      - hsm-downloader:/app/data/hytale-downloader
    networks:
      - hsm-dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend ─────────────────────────────────────────────────────────

  frontend:
    image: node:24-alpine
    container_name: hsm-frontend-dev
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm dev:frontend"
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=development
      - VITE_PORT=3030
      - VITE_PROXY_TARGET=http://server:8080
      - VITE_ALLOWED_HOSTS=
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/frontend/node_modules
    networks:
      - hsm-dev
    depends_on:
      server:
        condition: service_healthy

networks:
  hsm-dev:
    external: true
    name: hsm-dev

volumes:
  hsm-postgres-dev:
    external: true
    name: hytale_server_manager_hsm-postgres-dev
  hsm-redis-dev:
    external: true
    name: hytale_server_manager_hsm-redis-dev
  hsm-servers:
    external: true
    name: hytale_server_manager_hsm-servers
  hsm-backups:
    external: true
    name: hytale_server_manager_hsm-backups
  hsm-logs:
    external: true
    name: hytale_server_manager_hsm-logs
  hsm-certs:
    external: true
    name: hytale_server_manager_hsm-certs
  hsm-downloader:
    external: true
    name: hytale_server_manager_hsm-downloader
